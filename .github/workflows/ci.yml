name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://www.bulkskart.com
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkxNTQ0OTI3LCJleHAiOjE5NDkyMjQ5Mjd9.Eo6wtXsa-5OglX92lMRsqoC2yML6E2YsjqZ8yktOzng
      VITE_GTM_ID: GTM-T4HWCGKD
      VITE_APP_ID: app-egd29h5g4zcx
      VITE_SIMULATED_AUCTIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsgo -p tsconfig.check.json

      - name: Lint
        run: pnpm exec biome lint

      - name: Build
        run: pnpm exec vite build --outDir dist
